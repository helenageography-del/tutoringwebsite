server {
    listen 80;
    server_name localhost;

    root /site;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Block dotfiles (.git, .dockerignore, etc.) and repo/build metadata
    # that shouldn't be served, since this dev container mounts the whole
    # project directory for live editing.
    location ~ /\. {
        deny all;
    }

    location ~* ^/(Dockerfile|docker-compose.*\.yml|README\.md|BUILD_PROMPT\.md|nginx-dev\.conf)$ {
        deny all;
    }
}
